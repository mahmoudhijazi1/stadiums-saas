services:
  postgres:
    image: postgres:16-alpine
    container_name: stadiums-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: stadiums_local
      POSTGRES_PASSWORD: stadiums_local_dev
      POSTGRES_DB: stadiums_dev
    volumes:
      - stadiums_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stadiums_local -d stadiums_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stadiums_pg_data:
